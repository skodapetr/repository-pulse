name: Repository Pulse
description: Report what happened in a set of repositories over a time window, as structured JSON, agent-ready Markdown and a web viewer, with a history of earlier reports.
branding:
  icon: activity
  color: blue

inputs:
  repositories:
    description: >
      Repositories to report on, as owner/name. One per line, comma separated,
      or as a YAML-style "- owner/name" list. Lines starting with # are ignored.
    required: true
  components:
    description: >
      Outputs to produce, in order. Available: json, agent, step-summary.
      See the README for what each one writes.
    required: false
    default: json, agent
  days:
    description: Length of the time window in days, ending at `until`. Ignored when `since` is set.
    required: false
    default: '7'
  since:
    description: Start of the window (inclusive), as YYYY-MM-DD or an ISO 8601 timestamp. Overrides `days`.
    required: false
    default: ''
  until:
    description: End of the window (exclusive), as YYYY-MM-DD or an ISO 8601 timestamp. Defaults to the time of the run.
    required: false
    default: ''
  output-directory:
    description: Directory the components write into. Created if missing.
    required: false
    default: repository-pulse
  token:
    description: >
      Token used to read the repositories. The default workflow token can read public
      repositories and the repository the workflow runs in; use a personal access token
      or a GitHub App token for private repositories elsewhere.
    required: false
    default: ${{ github.token }}
  ignore-users:
    description: >
      Extra logins to treat as bots, in addition to accounts of type Bot and logins ending
      in "[bot]" or "-bot". Their comments, reviews and commits are left out.
    required: false
    default: ''
  title:
    description: Title used in the HTML page, the Markdown file and the step summary.
    required: false
    default: Repository pulse
  history-days:
    description: >
      Delete reports more than this many days older than the newest one. -1 keeps all.
      Combined with history-count, a report is deleted when either limit says so.
    required: false
    default: '-1'
  history-count:
    description: Keep only this many of the newest reports. -1 keeps all.
    required: false
    default: '-1'
  viewer:
    description: >
      What index.html is. "default" is the viewer bundled with the action, "none" writes
      no index.html, a path to a JavaScript file is inlined into index.html, and an https
      URL makes index.html load the viewer from there.
    required: false
    default: default
  restore-url:
    description: >
      Address of the published site (for example https://owner.github.io/repo/). Before the
      run, its manifest and reports are downloaded into output-directory so that the
      history continues. A missing manifest is treated as a first run.
    required: false
    default: ''

outputs:
  output-directory:
    description: Absolute path of the output directory.
  files:
    description: Paths of all files written, one per line.
  json-file:
    description: Path of this run's pulse/DATE.json, when the json component ran.
  agent-file:
    description: Path of this run's pulse/DATE.md, when the agent component ran.
  manifest-file:
    description: Path of manifest.json.
  viewer-file:
    description: Path of index.html, unless viewer is none.
  since:
    description: Resolved start of the window (ISO 8601, UTC).
  until:
    description: Resolved end of the window (ISO 8601, UTC).
  waiting-count:
    description: Number of open items where someone is expected to act.

runs:
  using: node24
  main: dist/action.js
