name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ is up to date
        run: git diff --exit-code -- dist/ || (echo "Run npm run build and commit dist/." && exit 1)
      - name: Smoke test the action on this repository
        uses: ./
        with:
          repositories: ${{ github.repository }}
          components: json, agent, step-summary
          days: 30
          output-directory: pulse-output
      - name: Check the written site
        run: |
          test -f pulse-output/index.html
          test -f pulse-output/pulse.md
          jq -e '.latest | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")' pulse-output/manifest.json
          jq -e '.reports[0].files.json' pulse-output/manifest.json
